services:
  postgres:
    image: postgres:17
    container_name: family-messenger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_messenger
      POSTGRES_USER: messenger_dev
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messenger_dev -d family_messenger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
