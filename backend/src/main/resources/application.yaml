spring:
  application:
    name: family-messenger-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/family_messenger
    username: messenger_dev
    password: local_dev_password

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://qvmjkrcmulqyqbryhvws.supabase.co/auth/v1
          jwk-set-uri: https://qvmjkrcmulqyqbryhvws.supabase.co/auth/v1/.well-known/jwks.json
          audiences:
            - authenticated
          jws-algorithms:
            - ES256

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info